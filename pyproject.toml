[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridle"
version = "0.1.0"
description = "Local MCP control plane for Cursor agents (allowlisted privileged adapters)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neil D. Lawrence", email = "lawrennd@gmail.com" }]
dependencies = [
  # Pin <2 for Cursor/FastMCP compatibility; revisit when MCPServer migration is ready.
  "mcp>=1.6.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bridle = "bridle.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
